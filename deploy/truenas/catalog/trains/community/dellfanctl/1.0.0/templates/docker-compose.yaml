{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.dellfanctl_container_name, "image") %}

{% do c1.set_user(0, 0) %}
{% do c1.set_privileged(true) %}
{% do c1.add_caps([
  "CHOWN",
  "DAC_OVERRIDE",
  "FOWNER",
  "FSETID",
  "MKNOD",
  "KILL",
  "SYS_RAWIO",
  "SETFCAP",
  "SETGID",
  "SETPCAP",
  "SETUID",
  "AUDIT_WRITE",
]) %}

{# Graceful shutdown hands fan control back to the iDRAC before exiting;
   give it the same room the systemd unit's TimeoutStopSec=15 does. #}
{% do c1.set_grace_period(15) %}

{# TZ is applied automatically to every container from the top-level
   [TZ] value - no need to set it manually here. #}

{# Full (read-write) host /dev - needed for raw IPMI commands to
   /dev/ipmi0 and for smartctl to see disks behind a hardware RAID/HBA
   controller, whose device nodes vary by board and can't be predicted
   here. /run/udev is read-only metadata smartctl uses to enumerate them. #}
{% do c1.add_storage("/dev", {"type": "host_path", "read_only": False, "host_path_config": {"path": "/dev", "create_host_path": False}}) %}
{% do c1.add_storage("/run/udev", {"type": "host_path", "read_only": True, "host_path_config": {"path": "/run/udev", "create_host_path": False}}) %}

{% do c1.add_storage(values.consts.config_dir, values.storage.config) %}
{% for store in values.storage.additional_storage %}
  {% do c1.add_storage(store.mount_path, store) %}
{% endfor %}

{# No network service to probe (dellfanctl exposes nothing); confirm the
   process itself is still running instead. #}
{% do c1.healthcheck.set_test("pgrep", {"process": "dellfanctl"}) %}

{{ tpl.render() | tojson }}
