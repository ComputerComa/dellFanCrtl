name: Release

# Builds a single static linux/amd64 binary (this is the only platform Dell
# PowerEdge/iDRAC hardware runs on) plus a matching sha256 checksum file, and
# publishes both as assets on a GitHub Release. install.sh downloads exactly
# these two files, so keep their names in sync with that script if you
# change them here.
#
# Also builds and pushes the same binary as a container image to GHCR
# (see the Dockerfile / deploy/truenas/), for appliance-style hosts like
# TrueNAS SCALE where a plain binary + systemd unit doesn't survive an OS
# update.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

env:
  BINARY_NAME: dellfanctl-linux-amd64
  IMAGE_NAME: ghcr.io/computercoma/dellfanctl

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF#refs/tags/}"
          fi
          if ! [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag '$tag' does not look like a semver tag (vX.Y.Z)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go vet ./... && go test ./...

      - name: Build
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags "-s -w -X dellfanctl/internal/version.Version=${{ steps.tag.outputs.tag }}" \
            -o "dist/${BINARY_NAME}" \
            ./cmd/dellfanctl

      - name: Checksum
        working-directory: dist
        run: sha256sum "${BINARY_NAME}" > "${BINARY_NAME}.sha256"

      - name: Verify checksum
        working-directory: dist
        run: sha256sum -c "${BINARY_NAME}.sha256"

      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/${{ env.BINARY_NAME }}
            dist/${{ env.BINARY_NAME }}.sha256

  docker:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            VERSION=${{ needs.release.outputs.tag }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ needs.release.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
